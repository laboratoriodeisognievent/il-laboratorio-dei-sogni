<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestione catalogo | Il Laboratorio Dei Sogni</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f7f8f8;
  color: #34434a;
  font-family: Arial, sans-serif;
  padding: 24px;
}

main { max-width: 850px; margin: auto; }

h1, h2 {
  font-family: Georgia, serif;
  color: #557786;
}

.card {
  background: white;
  border: 1px solid #e2e8e9;
  border-radius: 14px;
  padding: 22px;
  margin: 18px 0;
}

input:not([type="checkbox"]), textarea, select {
  width: 100%;
  padding: 12px;
  margin: 7px 0 15px;
  border: 1px solid #d4dfe2;
  border-radius: 8px;
  font: inherit;
}

label { font-size: 14px; font-weight: bold; }

button {
  padding: 12px 18px;
  border: 0;
  border-radius: 8px;
  background: #668b9a;
  color: white;
  font-weight: bold;
  cursor: pointer;
  margin: 4px;
  text-decoration: none;
  display: inline-block;
}

button.secondary, .home-link {
  background: #e8eff1;
  color: #405b66;
}

button.danger { background: #a94e4e; }

.home-link:hover, button.secondary:hover { background: #dce8eb; }
button:hover { opacity: .88; }

.product {
  border-bottom: 1px solid #e5e9ea;
  padding: 14px 0;
}

.product img {
  width: 65px;
  height: 65px;
  object-fit: cover;
  border-radius: 8px;
  float: left;
  margin-right: 12px;
}

.small { font-size: 13px; color: #718087; }
.hidden { display: none !important; }
#message { margin: 12px 0; color: #557786; }
#loginMessage { color: #a94e4e; }

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.image-upload {
  border: 1px dashed #a9c2cb;
  background: #f8fcfd;
  border-radius: 12px;
  padding: 16px;
  margin: 8px 0 18px;
}

.image-upload input {
  margin-top: 12px;
}

#imagePreview {
  display: block;
  max-width: 220px;
  max-height: 220px;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 10px;
  margin: 12px 0;
}

.upload-status {
  font-size: 13px;
  color: #557786;
  margin-top: 8px;
  overflow-wrap: anywhere;
}

@media(max-width:600px) {
  body { padding: 14px; }
  .card { padding: 17px; }
}
</style>
</head>

<body>
<main>

<h1>Il Laboratorio Dei Sogni</h1>
<p>Area riservata – Gestione catalogo</p>

<section class="card" id="login">
  <h2>Accedi</h2>

  <form id="loginForm">
    <label>Email</label>
    <input id="email" type="email" required autocomplete="username">

    <label>Password</label>
    <input id="password" type="password" required autocomplete="current-password">

    <button type="submit">Entra nel pannello</button>

    <a href="/" class="home-link"
       style="padding:12px 18px;border-radius:8px;text-decoration:none;display:inline-block;margin:4px;font-weight:bold;font-size:14px">
      Torna alla Home
    </a>
  </form>

  <p id="loginMessage"></p>
</section>

<section id="panel" class="hidden">

  <div class="card">
    <div class="actions">
      <button id="logout" class="secondary">Esci</button>

      <a href="/shop.html" target="_blank" rel="noopener noreferrer"
         class="home-link"
         style="padding:12px 18px;border-radius:8px;text-decoration:none;display:inline-block;margin:4px;font-weight:bold;font-size:14px">
        Visualizza Shop
      </a>
    </div>

    <h2>Prodotti del catalogo</h2>
    <button id="newProduct">+ Aggiungi prodotto</button>
    <div id="products">Caricamento...</div>
  </div>

  <div class="card hidden" id="editor">
    <h2 id="editorTitle">Nuovo prodotto</h2>

    <form id="productForm">

      <label>Nome prodotto</label>
      <input id="name" required>

      <label>Categoria</label>
      <select id="category" required></select>

      <div id="subcategoryBox" class="hidden">
        <label>Sezione catenella</label>
        <select id="subcategory">
          <option value="femminuccia">Femminuccia</option>
          <option value="maschietto">Maschietto</option>
        </select>
      </div>

      <label>Descrizione</label>
      <textarea id="description" rows="3"></textarea>

      <label>Prezzo in euro</label>
      <input id="price" type="number" min="0" step="0.01" required>

      <label>Fotografia prodotto</label>

      <div class="image-upload">
        <p class="small">
          Scegli una fotografia dalla galleria del tuo telefono.
          Verrà caricata automaticamente su GitHub.
        </p>

        <input
          id="imageFile"
          type="file"
          accept="image/jpeg,image/png,image/webp,image/gif"
        >

        <img id="imagePreview" class="hidden" alt="Anteprima fotografia">

        <p id="uploadStatus" class="upload-status">
          Nessuna nuova fotografia selezionata.
        </p>

        <button type="button" id="removeImage" class="secondary hidden">
          Rimuovi fotografia
        </button>
      </div>

      <input id="image" type="hidden">

      <label>Personalizzazioni (una per riga)</label>
      <textarea id="fields" rows="5"
        placeholder="Nome del bambino&#10;Colore: Rosa, Azzurro, Beige&#10;Decorazione: Cuore, Stella, Mongolfiera"></textarea>

      <label>
        <input id="visible" type="checkbox" checked
          style="width:auto;margin:0 6px 0 0">
        Prodotto visibile nel catalogo
      </label>

      <br><br>

      <button type="submit" id="saveProduct">Salva prodotto</button>
      <button type="button" id="cancel" class="secondary">Annulla</button>

    </form>
  </div>

</section>

<p id="message"></p>

</main>

<script>
const API = "/api";

let categories = [];
let editingId = null;
let selectedImage = null;
let previewObjectUrl = null;

const $ = id => document.getElementById(id);

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

async function api(path, options = {}) {
  const isFormData = options.body instanceof FormData;

  const response = await fetch(API + path, {
    ...options,
    credentials: "same-origin",
    headers: {
      ...(!isFormData && options.body
        ? {"Content-Type": "application/json"}
        : {}),
      ...(options.headers || {})
    }
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(data.error || "Si è verificato un errore");
  }

  return data;
}

function showMessage(message) {
  $("message").textContent = message;
}

function clearPreviewObjectUrl() {
  if (previewObjectUrl) {
    URL.revokeObjectURL(previewObjectUrl);
    previewObjectUrl = null;
  }
}

function showPreview(source) {
  if (!source) {
    $("imagePreview").src = "";
    $("imagePreview").classList.add("hidden");
    return;
  }

  $("imagePreview").src = source;
  $("imagePreview").classList.remove("hidden");
}

function resetImageSelection() {
  selectedImage = null;
  $("imageFile").value = "";
  clearPreviewObjectUrl();

  $("uploadStatus").textContent =
    "Nessuna nuova fotografia selezionata.";

  $("removeImage").classList.add("hidden");

  showPreview($("image").value);
}

$("imageFile").addEventListener("change", () => {
  const file = $("imageFile").files[0];

  if (!file) {
    resetImageSelection();
    return;
  }

  const allowedTypes = [
    "image/jpeg",
    "image/png",
    "image/webp",
    "image/gif"
  ];

  if (!allowedTypes.includes(file.type)) {
    $("imageFile").value = "";
    selectedImage = null;
    $("uploadStatus").textContent =
      "Formato non supportato. Usa JPG, PNG, WEBP o GIF.";
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    $("imageFile").value = "";
    selectedImage = null;
    $("uploadStatus").textContent =
      "La fotografia supera il limite di 5 MB.";
    return;
  }

  selectedImage = file;

  clearPreviewObjectUrl();
  previewObjectUrl = URL.createObjectURL(file);

  showPreview(previewObjectUrl);

  $("uploadStatus").textContent =
    "Fotografia selezionata: " + file.name;

  $("removeImage").classList.remove("hidden");
});

$("removeImage").addEventListener("click", () => {
  selectedImage = null;
  $("imageFile").value = "";
  $("image").value = "";

  clearPreviewObjectUrl();
  showPreview("");

  $("uploadStatus").textContent =
    "Fotografia rimossa. Il prodotto verrà salvato senza immagine.";

  $("removeImage").classList.add("hidden");
});

async function checkLogin() {
  try {
    await api("/admin/me");

    $("login").classList.add("hidden");
    $("panel").classList.remove("hidden");

    await loadCategories();
    await loadProducts();

  } catch {
    $("login").classList.remove("hidden");
    $("panel").classList.add("hidden");
  }
}

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();

  $("loginMessage").textContent = "Accesso in corso...";

  try {
    await api("/admin/login", {
      method: "POST",
      body: JSON.stringify({
        email: $("email").value,
        password: $("password").value
      })
    });

    $("password").value = "";
    $("loginMessage").textContent = "";

    await checkLogin();

  } catch(error) {
    $("loginMessage").textContent = error.message;
  }
});

$("logout").addEventListener("click", async () => {
  try {
    await api("/admin/logout", { method: "POST" });
  } catch {}

  $("panel").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("editor").classList.add("hidden");
  $("loginMessage").textContent = "";
});

async function loadCategories() {
  categories = await api("/admin/categories");

  $("category").innerHTML = categories.map(c =>
    `<option value="${c.id}">${esc(c.name)}</option>`
  ).join("");
}

async function loadProducts() {
  const products = await api("/admin/products");

  $("products").innerHTML = products.length
    ? products.map(p => `
      <div class="product">
        ${p.image_url ? `<img src="${esc(p.image_url)}" alt="">` : ""}

        <strong>${esc(p.name)}</strong>

        <p>
          € ${Number(p.price).toFixed(2)}
          · ${p.visible ? "Visibile" : "Nascosto"}
          ${p.category_slug === "catenelle-ciuccio"
            ? " · " + (p.subcategory === "maschietto" ? "Maschietto" : "Femminuccia")
            : ""}
        </p>

        <button class="secondary" data-edit="${p.id}">Modifica</button>
        <button class="danger" data-delete="${p.id}">Elimina</button>
        <div style="clear:both"></div>
      </div>
    `).join("")
    : "<p>Non hai ancora inserito prodotti.</p>";
}

/* SCELTA SEZIONE CATENELLE */

function updateSubcategoryVisibility() {
  const selected = categories.find(
    c => Number(c.id) === Number($("category").value)
  );

  $("subcategoryBox").classList.toggle(
    "hidden",
    selected?.slug !== "catenelle-ciuccio"
  );
}

$("category").addEventListener("change", updateSubcategoryVisibility);

/* APERTURA MODIFICA / NUOVO PRODOTTO */

function openEditor(product = null) {
  editingId = product ? product.id : null;

  $("editorTitle").textContent = product
    ? "Modifica prodotto"
    : "Nuovo prodotto";

  $("name").value = product?.name || "";
  $("category").value = product?.category_id || categories[0]?.id || "";
  $("subcategory").value = product?.subcategory || "femminuccia";
  $("description").value = product?.description || "";
  $("price").value = product?.price ?? "";
  $("image").value = product?.image_url || "";
  $("visible").checked = product ? !!product.visible : true;

  const fields = product?.custom_fields || [];

  $("fields").value = fields.map(f =>
    f.label + (f.options?.length ? ": " + f.options.join(", ") : "")
  ).join("\n");

  resetImageSelection();

  updateSubcategoryVisibility();

  $("editor").classList.remove("hidden");
  $("editor").scrollIntoView({ behavior: "smooth" });
}

$("newProduct").addEventListener("click", () => openEditor());

$("cancel").addEventListener("click", () => {
  $("editor").classList.add("hidden");
  resetImageSelection();
});

$("products").addEventListener("click", async e => {
  const editButton = e.target.closest("[data-edit]");
  const deleteButton = e.target.closest("[data-delete]");

  if (editButton) {
    try {
      const products = await api("/admin/products");

      const product = products.find(
        p => p.id === Number(editButton.dataset.edit)
      );

      if (product) openEditor(product);

    } catch(error) {
      showMessage(error.message);
    }
  }

  if (deleteButton) {
    if (!confirm("Vuoi davvero eliminare questo prodotto?")) return;

    try {
      await api(
        "/admin/products/" + deleteButton.dataset.delete,
        { method: "DELETE" }
      );

      showMessage("Prodotto eliminato.");
      await loadProducts();

    } catch(error) {
      showMessage(error.message);
    }
  }
});

/* CARICAMENTO FOTO SU GITHUB */

async function uploadImage(file) {
  const formData = new FormData();
  formData.append("image", file);

  $("uploadStatus").textContent =
    "Caricamento fotografia su GitHub in corso...";

  const result = await api("/admin/upload-image", {
    method: "POST",
    body: formData
  });

  if (!result.success || !result.image_url) {
    throw new Error("Caricamento della fotografia non riuscito.");
  }

  return result.image_url;
}

/* SALVATAGGIO PRODOTTO */

$("productForm").addEventListener("submit", async e => {
  e.preventDefault();

  const saveButton = $("saveProduct");
  saveButton.disabled = true;
  saveButton.textContent = "Salvataggio in corso...";

  try {
    let imageUrl = $("image").value.trim();

    if (selectedImage) {
      imageUrl = await uploadImage(selectedImage);

      $("image").value = imageUrl;

      $("uploadStatus").textContent =
        "Fotografia caricata correttamente su GitHub.";
    }

    const customFields = $("fields").value
      .split("\n")
      .map(line => line.trim())
      .filter(Boolean)
      .map(line => {
        const separator = line.indexOf(":");

        if (separator === -1) {
          return { label: line, options: [] };
        }

        return {
          label: line.slice(0, separator).trim(),
          options: line.slice(separator + 1)
            .split(",")
            .map(x => x.trim())
            .filter(Boolean)
        };
      });

    const body = {
      name: $("name").value.trim(),
      category_id: Number($("category").value),
      subcategory: $("subcategory").value,
      description: $("description").value,
      price: Number($("price").value),
      image_url: imageUrl,
      custom_fields: customFields,
      visible: $("visible").checked
    };

    const path = editingId
      ? "/admin/products/" + editingId
      : "/admin/products";

    await api(path, {
      method: editingId ? "PUT" : "POST",
      body: JSON.stringify(body)
    });

    $("editor").classList.add("hidden");

    resetImageSelection();

    showMessage("Prodotto salvato correttamente.");

    await loadProducts();

  } catch(error) {
    showMessage(error.message);
    $("uploadStatus").textContent = error.message;

  } finally {
    saveButton.disabled = false;
    saveButton.textContent = "Salva prodotto";
  }
});

checkLogin();
</script>

</body>
</html>
