<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il nostro catalogo | Il Laboratorio Dei Sogni</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fbfcfc;color:#394950;font-family:Arial,sans-serif}
header{text-align:center;padding:65px 20px 45px;background:#edf3f4}
.eyebrow{letter-spacing:3px;font-size:12px;color:#668b9a}
h1,h2,h3{font-family:Georgia,serif;color:#587887}
h1{font-size:clamp(32px,6vw,48px);font-weight:normal;margin:18px 0}
header p{max-width:600px;margin:0 auto 25px;line-height:1.7}
button{border:0;border-radius:25px;background:#668b9a;color:white;padding:13px 23px;cursor:pointer;font-size:15px}
button.secondary{background:#e7eff1;color:#4d6b77}
main{max-width:1100px;margin:auto;padding:30px 18px}
#categories{display:none;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.category{background:white;border:1px solid #e4ebed;border-radius:13px;padding:24px;text-align:center;cursor:pointer}
.category h3{font-size:20px;font-weight:normal}
#products{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:25px}
.product{background:white;border:1px solid #e4ebed;border-radius:13px;overflow:hidden}
.product img{width:100%;height:230px;object-fit:cover;background:#edf1f2}
.product-content{padding:17px}
.product h3{margin:0 0 9px;font-size:21px}
.product p{line-height:1.5;font-size:14px}
.price{font-weight:bold;color:#587887;font-size:18px}
.product input,.product select{width:100%;padding:10px;margin:5px 0 12px;border:1px solid #d9e2e4;border-radius:7px}
.product label{font-size:13px}
#catalogTitle{text-align:center}
#back{margin-top:20px}
#cart{background:#edf3f4;border-radius:13px;padding:20px;margin-top:35px}
#cartItems p{font-size:14px}
footer{text-align:center;padding:35px 15px;color:#718087;font-size:13px}
.hidden{display:none}
</style>
</head>
<body>

<header>
<div class="eyebrow">IL NOSTRO CATALOGO</div>
<h1>Piccole creazioni, grandi emozioni</h1>
<p>Scopri le nostre proposte e scegli i dettagli che preferisci. Ogni creazione può essere personalizzata insieme a noi.</p>
<button id="discover">Scopri il catalogo</button>
</header>

<main>
<section id="catalog">
<div id="categories"></div>
<div id="productsArea" class="hidden">
<button id="back" class="secondary">← Tutte le categorie</button>
<h2 id="catalogTitle"></h2>
<div id="products"></div>
</div>
</section>

<section id="cart" class="hidden">
<h2>Il tuo carrello</h2>
<div id="cartItems"></div>
<p id="cartTotal"></p>
<button id="sendOrder">Invia richiesta su WhatsApp</button>
</section>
</main>

<footer>Il Laboratorio Dei Sogni · Marsala e provincia di Trapani · Spedizioni in tutta Italia</footer>

<script>
const WHATSAPP = "393773611035";
const API = "/api";
let cart = [];
let categories = [];

const $ = id => document.getElementById(id);

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

async function getData(path) {
  const response = await fetch(API + path);
  if (!response.ok) throw new Error("Impossibile caricare il catalogo.");
  return response.json();
}

$("discover").addEventListener("click", async () => {
  $("discover").disabled = true;
  $("discover").textContent = "Caricamento...";
  try {
    categories = await getData("/categories");
    $("categories").innerHTML = categories.map(c => `
      <div class="category" data-slug="${esc(c.slug)}">
        <h3>${esc(c.name)}</h3>
        <p>${esc(c.description || "")}</p>
        <button>Scopri</button>
      </div>
    `).join("");
    $("categories").style.display = "grid";
    $("categories").scrollIntoView({behavior:"smooth"});
  } catch(error) {
    alert(error.message);
  } finally {
    $("discover").disabled = false;
    $("discover").textContent = "Scopri il catalogo";
  }
});

$("categories").addEventListener("click", async e => {
  const card = e.target.closest("[data-slug]");
  if (!card) return;
  await openCategory(card.dataset.slug);
});

async function openCategory(slug) {
  const category = categories.find(c => c.slug === slug);
  $("catalogTitle").textContent = category?.name || "Catalogo";
  $("categories").style.display = "none";
  $("productsArea").classList.remove("hidden");
  $("products").innerHTML = "<p>Caricamento prodotti...</p>";

  try {
    const products = await getData("/products?category=" + encodeURIComponent(slug));
    $("products").innerHTML = products.length
      ? products.map(renderProduct).join("")
      : "<p>Stiamo preparando le nostre creazioni per questa categoria. Contattaci per informazioni!</p>";
  } catch(error) {
    $("products").innerHTML = "<p>Non è stato possibile caricare i prodotti.</p>";
  }
}

function renderProduct(p) {
  const fields = Array.isArray(p.custom_fields) ? p.custom_fields : [];
  return `
    <article class="product" data-id="${p.id}">
      ${p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">` : ""}
      <div class="product-content">
        <h3>${esc(p.name)}</h3>
        <p>${esc(p.description || "")}</p>
        <div class="price">€ ${Number(p.price).toFixed(2)}</div>
        ${fields.map((f,i) => `
          <label>${esc(f.label)}</label>
          ${f.options?.length
            ? `<select data-field="${i}"><option value="">Seleziona</option>${f.options.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join("")}</select>`
            : `<input data-field="${i}" placeholder="Inserisci ${esc(f.label.toLowerCase())}">`
          }
        `).join("")}
        <label>Quantità</label>
        <input type="number" min="1" value="1" data-quantity>
        <button data-add="${p.id}">Aggiungi al carrello</button>
      </div>
    </article>
  `;
}

$("products").addEventListener("click", async e => {
  const button = e.target.closest("[data-add]");
  if (!button) return;

  const card = button.closest(".product");
  const id = Number(button.dataset.add);
  const fields = [...card.querySelectorAll("[data-field]")];
  const options = fields.map(f => ({
    name:f.previousElementSibling?.textContent || "Personalizzazione",
    value:f.value.trim()
  })).filter(f => f.value);

  const quantity = Math.max(1, Number(card.querySelector("[data-quantity]").value) || 1);
  const name = card.querySelector("h3").textContent;
  const price = Number(card.querySelector(".price").textContent.replace("€","").trim());

  cart.push({id,name,price,quantity,options});
  updateCart();
  $("cart").classList.remove("hidden");
  $("cart").scrollIntoView({behavior:"smooth"});
});

function updateCart() {
  $("cartItems").innerHTML = cart.length ? cart.map((item,i) => `
    <p><strong>${esc(item.name)}</strong> × ${item.quantity}
    ${item.options.map(o => `<br>${esc(o.name)}: ${esc(o.value)}`).join("")}
    <br>€ ${(item.price * item.quantity).toFixed(2)}
    <button class="secondary" data-remove="${i}">Rimuovi</button></p>
  `).join("") : "<p>Il carrello è vuoto.</p>";

  const total = cart.reduce((sum,item) => sum + item.price * item.quantity, 0);
  $("cartTotal").textContent = "Totale indicativo: € " + total.toFixed(2);
  $("sendOrder").disabled = !cart.length;
}

$("cartItems").addEventListener("click", e => {
  const button = e.target.closest("[data-remove]");
  if (!button) return;
  cart.splice(Number(button.dataset.remove),1);
  updateCart();
});

$("sendOrder").addEventListener("click", () => {
  if (!cart.length) return;

  let message = "Ciao! Vorrei richiedere informazioni e un preventivo per questi prodotti:\n\n";

  cart.forEach(item => {
    message += `${item.name} - Quantità: ${item.quantity} - € ${(item.price * item.quantity).toFixed(2)}\n`;
    item.options.forEach(o => {
      message += `${o.name}: ${o.value}\n`;
    });
    message += "\n";
  });

  message += "Vorrei sapere disponibilità e costi di spedizione. Grazie!";
  window.open("https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(message), "_blank");
});

$("back").addEventListener("click", () => {
  $("productsArea").classList.add("hidden");
  $("categories").style.display = "grid";
  $("categories").scrollIntoView({behavior:"smooth"});
});

updateCart();
</script>
</body>
</html>
